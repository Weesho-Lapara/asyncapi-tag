[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mkdocs-asyncapi-tag-plugin"
version = "1.0.0"
description = "DEPRECATED: renamed to 'asyncapi-tag'. This package only depends on it."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Weesho Lapara", email = "support@weesholapara.com" }]
keywords = ["asyncapi", "mkdocs", "deprecated"]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Framework :: MkDocs",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Documentation",
]
dependencies = ["asyncapi-tag[mkdocs]>=1.0.0,<2"]

[project.urls]
Homepage = "https://github.com/Weesho-Lapara/mkdocs-asyncapi-tag-plugin"
Replacement = "https://pypi.org/project/asyncapi-tag/"

# Deliberately no mkdocs.plugins entry point: the 'asyncapi-tag' plugin id is
# provided by the asyncapi-tag package this one depends on.

[tool.setuptools]
packages = ["mkdocs_asyncapi_tag"]
