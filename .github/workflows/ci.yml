name: CI

on:
  push:
    branches: [main, viewer-2]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Test
        run: python -m pytest

  viewer:
    name: Viewer (Node build, lint, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck and lint
        run: npm run check
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Both bundles exist
        run: test -s dist/asyncapi-viewer.js && test -s dist/asyncapi-viewer.iife.js

  viewer-e2e:
    name: "Viewer (Playwright: accessibility, CSP, screenshots)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Playwright
        run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: viewer-screenshots
          path: |
            viewer/test/e2e/screenshots/
            viewer/playwright-report/
          if-no-files-found: ignore

  docs:
    name: Docs site (strict build, MkDocs and Zensical)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[docs]" zensical
      - name: MkDocs strict build
        run: mkdocs build --strict --site-dir site-mkdocs
      - name: Zensical build
        run: zensical build
      - name: Both outputs contain the rendered demo
        run: |
          for site in site-mkdocs site; do
            test "$(grep -o 'data-asyncapi-src="[^"]*"' "$site/demo/index.html" | wc -l)" -ge 3 || { echo "no viewer markup in $site"; exit 1; }
            grep -q 'integrity="sha384-' "$site/demo/index.html" || { echo "no SRI attributes in $site"; exit 1; }
          done

  package:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade pip build twine
      - name: Build asyncapi-viewer
        run: python -m build --outdir dist/asyncapi-viewer
      - name: Build asyncapi-tag (deprecated shim)
        run: python -m build --outdir dist/asyncapi-tag legacy/asyncapi-tag
      - name: Check metadata
        run: python -m twine check dist/*/*
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/
