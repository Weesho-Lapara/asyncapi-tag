# Early warning for upstream changes that would break the plugin. Runs weekly
# and on demand; failures here are informational and do not block anything.
name: Compatibility

on:
  schedule:
    - cron: "41 6 * * 1" # Mondays 06:41 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mkdocs-next:
    name: MkDocs 2.0 pre-release
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install with the MkDocs pre-release
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install --pre --upgrade "mkdocs>=2.0.dev0"
          python -c "import mkdocs; print('mkdocs', mkdocs.__version__)"
      - name: Test suite
        run: python -m pytest
      - name: Build the docs site
        run: python -m pip install mkdocs-material && mkdocs build --strict

  markdown-next:
    name: Latest Python-Markdown and Material
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install everything at the newest versions
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade -e ".[test,docs]"
          python -m pip list | grep -iE "^(markdown|mkdocs|mkdocs-material) "
      - run: python -m pytest
      - run: mkdocs build --strict
