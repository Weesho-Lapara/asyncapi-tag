# Weekly check for a new @asyncapi/react-component release. When one exists,
# re-pins the viewer (URLs + SRI hashes), runs the test suite against it and
# opens a pull request. Pull requests opened with GITHUB_TOKEN do not trigger
# the CI workflow, so the tests run here before the PR is created.
name: Update viewer

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Re-pin the viewer
        id: bump
        run: |
          python scripts/update_viewer.py | tee bump.log
          tail -n1 bump.log | tr ' ' '\n' >> "$GITHUB_OUTPUT"
      - name: Test against the new viewer
        if: steps.bump.outputs.old != steps.bump.outputs.new
        run: python -m pytest
      - name: Open pull request
        if: steps.bump.outputs.old != steps.bump.outputs.new
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/update-viewer
          delete-branch: true
          commit-message: "Pin viewer to @asyncapi/react-component ${{ steps.bump.outputs.new }}"
          title: "Pin viewer to @asyncapi/react-component ${{ steps.bump.outputs.new }}"
          labels: dependencies
          body: |
            Automated bump of the pinned AsyncAPI viewer.

            - Previous: `${{ steps.bump.outputs.old }}`
            - New: `${{ steps.bump.outputs.new }}`
            - Upstream release notes: https://github.com/asyncapi/asyncapi-react/releases/tag/v${{ steps.bump.outputs.new }}

            `assets.py` (URLs and SRI hashes) and `CHANGELOG.md` were updated by
            `scripts/update_viewer.py`. The test suite passed against the new bundle in
            the workflow run that opened this PR. Before merging, skim the upstream notes
            for breaking changes to the standalone bundle or its config options.
