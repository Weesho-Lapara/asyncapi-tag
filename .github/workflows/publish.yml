# Publishes to PyPI with trusted publishing (no API tokens) whenever a version
# tag is pushed, then creates the GitHub release with the matching CHANGELOG
# section as notes:
#   git tag v1.2.3 && git push origin v1.2.3
#
# One-time setup on PyPI for EACH project (asyncapi-viewer and the
# deprecated asyncapi-tag shim): Manage project -> Publishing -> Add a GitHub
# publisher with owner Weesho-Lapara, repository asyncapi-viewer, workflow
# publish.yml, environment pypi. (Already done for both.)
name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build --outdir dist/asyncapi-viewer
      - run: python -m build --outdir dist/asyncapi-tag legacy/asyncapi-tag
      - run: python -m twine check dist/*/*
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/

  publish-asyncapi-viewer:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/asyncapi-viewer

  github-release:
    needs: publish-asyncapi-viewer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/
      - name: Extract this version's changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## / { on = index($0, "asyncapi-viewer " v " ") == 4 }
            on && !/^## / { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q . notes.md; then
            echo "No CHANGELOG.md section for asyncapi-viewer $version" >&2; exit 1
          fi
          { echo "Install: \`pip install asyncapi-viewer==$version\`"; echo; cat notes.md; } > release-notes.md
          cat release-notes.md
      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: dist/asyncapi-viewer/*

  publish-legacy-shim:
    # Publishes the deprecated `asyncapi-tag` shim once, with the 1.2.0 release;
    # later releases of asyncapi-viewer do not need a new shim version.
    if: github.ref_name == 'v1.2.0'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/asyncapi-tag
