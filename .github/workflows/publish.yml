# Publishes to PyPI with trusted publishing (no API tokens). One-time setup on
# PyPI for EACH project (asyncapi-tag and mkdocs-asyncapi-tag-plugin):
#   Manage project -> Publishing -> Add a GitHub publisher
#   owner: Weesho-Lapara, repository: mkdocs-asyncapi-tag-plugin,
#   workflow: publish.yml, environment: pypi
# Then create a GitHub release with tag v<version> to trigger this workflow.
name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build --outdir dist/asyncapi-tag
      - run: python -m build --outdir dist/mkdocs-asyncapi-tag-plugin legacy/mkdocs-asyncapi-tag-plugin
      - run: python -m twine check dist/*/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  publish-asyncapi-tag:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/asyncapi-tag

  publish-legacy-shim:
    # Publishes the deprecated shim only for the 1.0.0 release; later releases
    # of asyncapi-tag do not need a new shim version.
    if: startsWith(github.ref, 'refs/tags/v1.0.0')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/mkdocs-asyncapi-tag-plugin
